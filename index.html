<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KEII4YOU Payment Gateway</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #0d6efd, #1e90ff);
}

.card {
  background: white;
  width: 360px;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.25);
  text-align: center;
  animation: fadeIn 0.4s ease;
}

.title {
  font-size: 26px;
  font-weight: bold;
  color: #0d6efd;
}

.subtitle {
  font-size: 14px;
  color: #777;
  margin-bottom: 25px;
}

/* PAYMENT BOX */
.payment-box {
  background: #f5f8ff;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  transition: 0.25s;
}

.payment-box:hover {
  transform: scale(1.03);
  background: #e7efff;
}

.method {
  font-weight: bold;
  font-size: 17px;
}

.number {
  margin-top: 6px;
  font-size: 14px;
  color: #555;
}

/* BUTTON */
.btn {
  margin-top: 10px;
  padding: 7px 14px;
  border: none;
  background: #0d6efd;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
}

.btn:hover {
  background: #0b5ed7;
}

/* QRIS STYLE */
.qris-box {
  margin-top: 10px;
  background: #eaf2ff;
  padding: 14px;
  border-radius: 12px;
}

.footer {
  margin-top: 18px;
  font-size: 12px;
  color: #aaa;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="card">
  <div class="title">KEII4YOU</div>
  <div class="subtitle">Payment Gateway</div>

  <!-- DANA -->
  <div class="payment-box">
    <div class="method">💙 DANA</div>
    <div class="number">0895401998581<br>A/N ANI</div>
    <button class="btn" onclick="copyText('0895401998581')">Copy</button>
  </div>

  <!-- GOPAY -->
  <div class="payment-box">
    <div class="method">💚 GOPAY</div>
    <div class="number">0895401998581<br>A/N RADITYA</div>
    <button class="btn" onclick="copyText('0895401998581')">Copy</button>
  </div>

  <!-- QRIS -->
  <div class="payment-box qris-box">
    <div class="method">🟦 QRIS</div>
    <button class="btn" onclick="openQRIS()">Buka QRIS</button>
  </div>

  <div class="footer">Terima kasih sudah melakukan pembayaran 🙏</div>
</div>

<script>
function copyText(text) {
  navigator.clipboard.writeText(text);
  alert("Nomor berhasil disalin!");
}

function openQRIS() {
  window.open("http://tmpfiles.org/dl/23223024/1770577633501.jpg", "_blank");
}
</script>

</body>
</html>
