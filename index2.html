<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KEIISTORE PAYMENT</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

/* ===== BACKGROUND VIDEO ===== */
.bg-video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-1;
  filter:brightness(0.45);
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

/* ===== CARD ===== */
.container{
  width:95%;
  max-width:380px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(16px);
  border-radius:20px;
  padding:25px;
  box-shadow:0 0 45px rgba(0,198,255,.35);
  text-align:center;
  animation:fade .8s ease;
}

@keyframes fade{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

h1{ margin-bottom:18px; font-size:22px; }

.pay-box{
  background:rgba(255,255,255,0.12);
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
  cursor:pointer;
  transition:.25s;
}

.pay-box:hover{
  background:rgba(0,198,255,0.25);
  transform:scale(1.03);
}

.label{ font-size:13px; opacity:.7; }
.number{ font-weight:bold; font-size:15px; margin-top:4px; }
.name{ font-size:12px; opacity:.8; }

/* QRIS */
.qris img{
  width:170px;
  margin-top:8px;
  border-radius:12px;
}

/* INSTRUKSI */
.notice{
  margin-top:15px;
  font-size:13px;
  background:rgba(255,255,255,.08);
  padding:10px;
  border-radius:10px;
}

/* BUTTON */
button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  transition:.25s;
  color:white;
}

.btn-proof{
  background:#00c6ff;
  color:black;
  box-shadow:0 0 12px rgba(0,198,255,.7);
}

.btn-admin{ background:#2AABEE; }
.btn-channel{ background:#229ED9; }
.btn-group{ background:#1c8adb; }

button:hover{ transform:scale(1.05); }

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#00c6ff;
  color:black;
  padding:8px 14px;
  border-radius:8px;
  opacity:0;
  transition:.3s;
  font-size:13px;
}

.toast.show{ opacity:1; }

.footer{
  margin-top:12px;
  font-size:12px;
  opacity:.7;
}
</style>
</head>

<body>

<!-- 🎥 VIDEO BACKGROUND + SOUND -->
<video id="bgVideo" autoplay loop playsinline class="bg-video">
  <source src="https://n.uguu.se/qvDQacOK.mp4" type="video/mp4">
</video>

<div class="container">
  <h1>💳 KEIISTORE PAYMENT</h1>

  <!-- DANA -->
  <div class="pay-box" onclick="copyText('0895401998581')">
    <div class="label">DANA</div>
    <div class="number">0895401998581</div>
    <div class="name">A/N ANIG</div>
  </div>

  <!-- GOPAY -->
  <div class="pay-box" onclick="copyText('0895401998581')">
    <div class="label">GOPAY</div>
    <div class="number">0895401998581</div>
    <div class="name">A/N RADITYA</div>
  </div>

  <!-- QRIS -->
  <div class="qris">
    <div class="label">QRIS</div>
    <img src="https://iili.io/fpxyFBn.jpg">
  </div>

  <!-- INSTRUKSI -->
  <div class="notice">
    ✅ Setelah transfer / scan QRIS<br>
    Kirim bukti pembayaran ke admin
  </div>

  <!-- KIRIM BUKTI -->
  <a href="https://t.me/keiiihostting?text=Halo%20admin%20saya%20sudah%20transfer%20ini%20bukti%20pembayaran%20saya" target="_blank">
    <button class="btn-proof">📤 Kirim Bukti Transfer</button>
  </a>

  <!-- TELEGRAM -->
  <a href="https://t.me/keiiihostting" target="_blank">
    <button class="btn-admin">💬 Chat Admin</button>
  </a>

  <a href="https://t.me/TestimoniKeiiStore" target="_blank">
    <button class="btn-channel">📢 Channel</button>
  </a>

  <a href="https://t.me/+TTijnJTmIVMwZTg1" target="_blank">
    <button class="btn-group">👥 Group</button>
  </a>

  <div class="footer">
    Klik nomor untuk otomatis copy ✔
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* COPY NUMBER */
function copyText(text){
  navigator.clipboard.writeText(text);
  const toast=document.getElementById("toast");
  toast.innerText="✔ Nomor disalin: "+text;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1500);
}

/* SOUND AUTOPLAY FIX */
const video = document.getElementById("bgVideo");
video.volume = 0.6;

video.play().catch(()=>{
  document.body.addEventListener("click", ()=>{
    video.play();
  }, { once:true });
});
</script>

</body>
</html>
